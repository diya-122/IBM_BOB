version: '3.9'

services:
  engine:
    image: node:20-alpine
    working_dir: /app/engine
    volumes:
      - .:/app
      - coverage_data:/app/coverage
    command: sh -c "npm install && npm run build"
    environment:
      - NODE_ENV=production

  dashboard:
    image: node:20-alpine
    working_dir: /app/dashboard
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  sample-app:
    image: node:20-alpine
    working_dir: /app/sample-app
    volumes:
      - .:/app
      - coverage_data:/app/sample-app/coverage
    ports:
      - "3000:3000"
    command: sh -c "npm install && node src/server.js"
    environment:
      - NODE_ENV=development
      - PORT=3000

volumes:
  coverage_data:
